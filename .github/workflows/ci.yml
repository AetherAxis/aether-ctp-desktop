name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 本仓 checkout 到仓名目录（跨仓 ProjectReference 解析到同级 <dep>/ 目录）
      - uses: actions/checkout@v4
        with:
          path: aether-desktop
      # 跨仓依赖（本地 ProjectReference 拓扑——切 PackageReference 后可移除）：
      # desktop → workbench / client / ledger / exchange.Rpc（传递：contracts / core / exchange）
      - uses: actions/checkout@v4
        with:
          repository: AetherAxis/aether-workbench
          path: aether-workbench
      - uses: actions/checkout@v4
        with:
          repository: AetherAxis/ctp-net-client
          path: ctp-net-client
      - uses: actions/checkout@v4
        with:
          repository: AetherAxis/ctp-net-contracts
          path: ctp-net-contracts
      - uses: actions/checkout@v4
        with:
          repository: AetherAxis/ctp-net-core
          path: ctp-net-core
      - uses: actions/checkout@v4
        with:
          repository: AetherAxis/aether-ledger
          path: aether-ledger
      - uses: actions/checkout@v4
        with:
          repository: AetherAxis/aether-exchange
          path: aether-exchange
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # GitHub Packages 私有源凭据（GITHUB_TOKEN 只写进 CI 运行时文件，不入库）。
      # 依赖仓为私有仓时 GITHUB_TOKEN 默认不能跨仓读取——需在 org Settings → Actions →
      # General 开放 accessible repositories，或改用 PAT secret。
      - name: Configure GitHub Packages credentials
        run: >
          dotnet nuget update source github
          --configfile aether-desktop/nuget.config
          --username AetherAxis
          --password ${{ secrets.GITHUB_TOKEN }}
          --store-password-in-clear-text

      # Avalonia（普通 SDK，linux 可 build）。
      - name: Build
        run: dotnet build aether-desktop.slnx -c Release
        working-directory: aether-desktop

      # 纯逻辑面（不起窗口、不初始化 Avalonia 平台）：偏好存储（同步契约/坏档重建/跨实例持久化/
      # 密码键可彻底删除）、连接预设档案（用户档优先/坏档回退内置/清单非空）、显示格式（方向/开平/
      # 委托状态字符 → 中文，以契约为准）。控件与真实登录/下单仍靠实跑验收。
      - name: Test
        run: dotnet test aether-desktop.slnx -c Release --no-build
        working-directory: aether-desktop
